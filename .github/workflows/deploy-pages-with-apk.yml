name: Deploy GitHub Pages with beta APK

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Assemble public site and fetch matching APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/downloads
          cp index.html app.js styles.css update.json yongqian-standalone.html preview-desktop.png preview-mobile.png _site/
          cp -R assets/. _site/assets/
          if test -d public-site; then cp -R public-site _site/public-site; fi
          if test -d disabled; then cp -R disabled _site/disabled; fi
          if test -d activations; then cp -R activations _site/activations; fi

          version="$(jq -r '.versionName' update.json)"
          expected_sha="$(jq -r '.sha256' update.json | tr '[:lower:]' '[:upper:]')"
          expected_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/downloads/v${version}/app-arm64-v8a-debug.apk"
          actual_url="$(jq -r '.apkUrl' update.json)"
          test "$actual_url" = "$expected_url"
          test "$(jq -r '.channel' update.json)" = "beta"
          test "$(jq -r '.forceUpdate' update.json)" = "false"

          release_json="$(gh api "repos/${{ github.repository }}/releases/tags/v${version}")"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "true"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          asset_count="$(jq '[.assets[] | select(.name == "app-arm64-v8a-debug.apk")] | length' <<<"$release_json")"
          test "$asset_count" = "1"

          mkdir -p "_site/downloads/v${version}"
          gh release download "v${version}" --repo "${{ github.repository }}" \
            --pattern 'app-arm64-v8a-debug.apk' --dir "_site/downloads/v${version}"
          actual_sha="$(sha256sum "_site/downloads/v${version}/app-arm64-v8a-debug.apk" | awk '{print toupper($1)}')"
          test "$actual_sha" = "$expected_sha"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
